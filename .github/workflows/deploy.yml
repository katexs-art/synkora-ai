name: Auto-Deploy to VPS

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "🚀 Starting deploy..."
            
            cd /opt/synkora-ai
            
            # Pull latest code
            git pull origin master
            
            # Rebuild web
            cd web
            rm -rf .next
            npm run build
            
            # Restart web service
            sudo systemctl restart synkora-web
            
            # Restart API
            cd /opt/synkora-ai/api
            docker compose restart api
            
            echo "✅ Deploy complete!"
